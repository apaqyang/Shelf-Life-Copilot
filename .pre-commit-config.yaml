repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
      - id: docs-check
        name: documentation links and commands
        entry: uv run python tools/check_docs.py
        language: system
        pass_filenames: false
      - id: no-internal-leak
        name: public content boundary
        entry: uv run python tools/check_no_internal_leak.py
        language: system
        pass_filenames: false
